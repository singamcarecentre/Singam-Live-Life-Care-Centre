<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singam Care Centre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Shortened Wavy Background */
        .hero {
            position: relative;
            width: 100%;
            height: 60vh; /* Reduced height */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            padding-top: 30px;
            --s: 80px; /* Adjusted size */
            --c1: #f8b195;
            --c2: #355c7d;
            --_g: var(--c2) 4% 14%, var(--c1) 14% 24%, var(--c2) 22% 34%,
                  var(--c1) 34% 44%, var(--c2) 44% 56%, var(--c1) 56% 66%, var(--c2) 66% 76%,
                  var(--c1) 76% 86%, var(--c2) 86% 96%;
            background: radial-gradient(
                          100% 100% at 100% 0,
                          var(--c1) 4%,
                          var(--_g),
                          #0008 96%,
                          #0000
                        ),
                        radial-gradient(
                          100% 100% at 0 100%,
                          #0000,
                          #0008 4%,
                          var(--_g),
                          var(--c1) 96%
                        )
                        var(--c1);
            background-size: var(--s) var(--s);
            animation: wave 6s infinite linear;
        }

        @keyframes wave {
            0% { background-position: 0px 0px; }
            50% { background-position: 50px 50px; }
            100% { background-position: 0px 0px; }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 15px;
			text-align: center;
			background: rgba(0, 0, 0, 0.6); /* Dark background */
			color: white; /* Ensures contrast */
			border-radius: 10px;
			box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 100px;
            border-radius: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        h1 {
            font-size: 40px;
            font-weight: bold;
            text-shadow: 3px 3px 8px black;
        }

        p {
		font-size: 18px; /* Increased font size */
		font-weight: bold;
		margin: 10px 0 15px;
		text-shadow: 2px 2px 5px black; /* Adds visibility */
		}

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: white;
            color: black;
            font-size: 14px;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
            transform: scale(1);
            animation: fadeIn 2s ease-out forwards 0.5s;
        }

        .btn:hover {
            background: #ff6600;
            color: white;
            transform: scale(1.1);
        }

        /* Image Gallery */
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 30px 10px;
            background: white;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
			animation: wobble 3s infinite ease-in-out; /* Continuous wobble */
			user-select: auto; /* Allows text & image selection */
			cursor: pointer; /* Makes images clickable */
        }

        .gallery img:hover {
            transform: scale(1.1) rotate(-2deg);
        }
		
		/* Click-to-Enlarge Effect */
		.fullscreen-img {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.8);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 1000;
			visibility: hidden;
			opacity: 0;
			transition: opacity 0.3s ease-in-out, visibility 0.3s;
		}
		
		/* Enlarged Image */
		.fullscreen-img img {
			max-width: 90%;
			max-height: 90%;
			border-radius: 10px;
			box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.5);
		}
		
		/* Show Enlarged Image */
		.fullscreen-img.show {
			visibility: visible;
			opacity: 1;
		}
		
		.gallery img:active {
			 transform: scale(1.05) rotate(0deg);
			 box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
		}
		
		@keyframes wobble {
			0% { transform: rotate(0deg); }
			25% { transform: rotate(1deg); }
			50% { transform: rotate(-1deg); }
			75% { transform: rotate(1deg); }
			100% { transform: rotate(0deg); }
		}

    </style>
</head>
<body>

    <div class="hero">
        <img src="logo.png" alt="Singam Care Centre Logo" class="logo">
        <h1>Singam Live & Life Care Centre</h1>
        <div class="content">
            <p>We welcome you to our old folks home. <br> Our Resident, Our Concern.</p>
            <p>Selamat datang ke rumah orang tua dan OKU kami. <br> Penghuni Kami, Keprihatinan Kami.</p>
            <div class="btn-container">
                <a href="sllcc html -About Us.html" class="btn">Read More</a>
                <a href="sllcc html -Contact Us.html" class="btn">Contact Us</a>
            </div>
        </div>
    </div>

    <!-- Image Gallery -->
    <div class="gallery">
        <img src="image9.jpg" alt="Singam Care Centre">
		<img src="image3.png" alt="Elderly Care Home">
        <img src="image2.png" alt="Residents Socializing">
		<img src="image6.png" alt="Celebration Activities">
        <img src="image4.png" alt="Resident Care">
        <img src="image1.png" alt="Outdoor Activities">
    </div>
	
	<!-- Fullscreen Image Viewer -->
	<div class="fullscreen-img">
        <img src="" alt="Enlarged View">
    </div>
	
	<!-- JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const images = document.querySelectorAll(".gallery img");
            const fullscreenDiv = document.querySelector(".fullscreen-img");
            const fullscreenImg = fullscreenDiv.querySelector("img");

            images.forEach(img => {
                img.addEventListener("click", function () {
                    fullscreenImg.src = img.src;
                    fullscreenDiv.classList.add("show");
                });
            });

            fullscreenDiv.addEventListener("click", function (e) {
			    if (e.target !== fullscreenImg) {
                    fullscreenDiv.classList.remove("show");
					}
            });
        });
    </script>

</body>
</html>
