<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Location - Singam Live & Life Care Centre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
			
        }

        :root {
            --s: 60px;
            --c1: #f8b195;
            --c2: #355c7d;
            --_g: var(--c2) 4% 14%, var(--c1) 14% 24%, var(--c2) 22% 34%,
                  var(--c1) 34% 44%, var(--c2) 44% 56%, var(--c1) 56% 66%, var(--c2) 66% 76%,
                  var(--c1) 76% 86%, var(--c2) 86% 96%;
        }

        body {
            background: radial-gradient(
                        100% 100% at 100% 0,
                        var(--c1) 4%,
                        var(--_g),
                        #0008 96%,
                        #0000
                      ),
                      radial-gradient(
                        100% 100% at 0 100%,
                        #0000,
                        #0008 4%,
                        var(--_g),
                        var(--c1) 96%
                      )
                      var(--c1);
            background-size: var(--s) var(--s);
            animation: wave 6s infinite linear;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #355c7d;
            padding: 2px 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-container img {
            height: 30px;
            width: 30px;
            border-radius: 10%;
            border: 1px solid white;
            object-fit: cover;
        }

        .logo-container h1 {
            color: white;
            font-size: 18px;
            margin-left: 10px;
        }

        .nav-links {
            display: flex;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-links a:hover {
            background: #f67280;
        }

        .hero {
            width: 100%;
            height: 19vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            background: inherit;
        }
		
		@keyframes wave {
            0% { background-position: 0px 0px; }
            50% { background-position: 50px 50px; }
            100% { background-position: 0px 0px; }
        }

        @keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
		
		h2 {
            font-size: 40px;
            font-weight: bold;
			color: white;
			padding: 8px;
			text-align: center;
            text-shadow: 2px 2px 5px black;
			animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

		
		.main-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            width: 75%;
            max-width: 1800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
			margin: 0 auto;
			animation: slideUp 1.5s ease-in-out;
			
        }

        .location-content-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            padding: 5px;
        }
		
		.location-text-a{
			font-size: 16px;
            line-height: 1.5;
            color: #444;
            max-width: 1000px;
            margin-bottom: 10px;
            text-align: justify;
            text-align-last: center;
		}

        .image-wrapper {
            flex: 1;
            text-align: center;
            padding-right: 20px;
        }

        @keyframes zoomIn {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
		
		.image-gallery img {
            width: 300px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
			animation: zoomIn 1s ease-in-out;
        }

        .map-container {
            flex: 1;
            text-align: right;
			width: 80%; 
            max-width: 500px;
			padding: 5px;
        }

        .fullscreen-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, visibility 0.3s;
        }

        .fullscreen-img img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.5);
        }

        .fullscreen-img.show {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .location-content-wrapper {
                flex-direction: column;
                text-align: center;
				
            }

            .image-wrapper, .map-container {
                width: 100%;
                text-align: center;
                padding: 0;
            }
        }

        .footer {
            height: 19vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer .btn {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background: #355c7d;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .footer .btn:hover {
            background: #f8b195;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Singam Care Logo">
            <h1>Singam Live & Life Care</h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="sllcc html -About Us.html">About Us</a>
            <a href="sllcc html -Our Services.html">Our Services</a>
            <a href="sllcc html -Our Location.html">Our Location</a>
            <a href="sllcc html -Contact Us.html">Contact Us</a>
        </div>
    </div>

    
    <h2>We've Located</h2>
    

    <div class="main-container">
     
		<h3>📍 Singam Live & Life Care Centre</h3>
		
		<p class=location-text-a> C9367, Jalan Padang Jambu, Bukit Sebukor, 75150 Melaka, Melaka.</p>
				      <p>
                <a href="https://maps.app.goo.gl/om26GgSaf65zaUpa6" target="_blank">🔗 View on Google Maps</a>
              </p>
			
     
          <div class="location-content-wrapper">
            <div class="image-wrapper"> 
                <div class="image-gallery">
                    <a href="javascript:void(0)">
                        <img src="location photo.jpg" alt="Singam Live & Life Care Centre">
                    </a>
                </div>
                <p>Entrance of Singam Live & Life Care Centre</p>
            </div>

            <div class="map-container">
                <iframe 
				                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3986.7966767479043!2d102.2747237!3d2.2300269!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31d1ef9f74e16cbb%3A0xc5f41d7b4aab4a17!2sSingam%20Live%20%26%20Life%20Care%20Centre!5e0!3m2!1sen!2smy!4v1740043886134!5m2!1sen!2smy" 
				                  width="500" 
				                  height="300" 
								  border-radius="10px"
				                  style="border:0;" 
				                  allowfullscreen="" 
				                  loading="lazy" referrerpolicy="no-referrer-when-downgrade"
					            ></iframe>
            </div>
        </div>
    </div>

    <div class="fullscreen-img">
        <img src="" alt="Enlarged Image">
    </div>


 <script>
        document.querySelector(".image-gallery img").addEventListener("click", function () {
            document.querySelector(".fullscreen-img img").src = this.src;
            document.querySelector(".fullscreen-img").classList.add("show");
        });

        document.querySelector(".fullscreen-img").addEventListener("click", function (e) {
            if (e.target !== this.querySelector("img")) this.classList.remove("show");
        });
    </script>

</body>
</html>
